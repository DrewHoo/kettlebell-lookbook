<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{meta_description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{meta_description}}">
<meta property="og:url" content="https://drewhoover.com/kettlebell-lookbook/">
<meta property="og:image" content="https://drewhoover.com/kettlebell-lookbook/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{meta_description}}">
<meta name="twitter:image" content="https://drewhoover.com/kettlebell-lookbook/og.png">
<link rel="canonical" href="https://drewhoover.com/kettlebell-lookbook/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M22 26c-4-6-3-18 10-18s14 12 10 18' fill='none' stroke='%23191917' stroke-width='6'/%3E%3Ccircle cx='32' cy='40' r='19' fill='%23191917'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://drewhoover.com/embed/back-bar.js" async></script>
<script src="https://drewhoover.com/embed/giscus.js" async></script>
<script src="https://drewhoover.com/embed/analytics.js" async></script>
<style>
:root{--paper:#efeeea;--card:#fcfbf9;--ink:#191917;--muted:#62615a;--hair:#d8d6cf;--accent:#5b3a8c;--ok:#2f6b45;--ok-bg:#e2efe5;--warn-bg:#f8e7cf;--warn-ink:#7a4306;--no-ink:#8a2416;--track:#e1dfd8;--yellow:#e8b321}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
.masthead{padding:52px 0 20px}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.kicker a{color:inherit;text-decoration:none;transition:.15s;border-bottom:1px solid color-mix(in srgb,currentColor 35%,transparent)}
.kicker a:hover{border-bottom-color:currentColor}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(38px,6.4vw,70px);line-height:1;letter-spacing:-.02em;margin:14px 0;max-width:17ch}
.sub{font-size:clamp(17px,2.1vw,20px);max-width:720px;margin:0}
.mono{font:500 12px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.pick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0;background:var(--card);border:1.5px solid var(--ink);margin:26px 0 14px}
.pick .ph{background:#fff;display:flex;align-items:center;justify-content:center;padding:14px;min-height:260px}
.pick .ph img{max-height:340px;object-fit:contain}
.pick .pb{padding:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.pick h2{font:800 clamp(26px,3.4vw,36px)/1.08 Fraunces,Georgia,serif;margin:0}
.pick p{margin:0}
.lines{width:100%;border-collapse:collapse;font-size:15px}
.lines td{padding:7px 0;border-top:1px solid var(--hair);vertical-align:top}
.lines td:last-child{text-align:right;font:600 15px "IBM Plex Mono",monospace;white-space:nowrap;padding-left:12px}
.lines small{display:block;color:var(--muted);font-size:13px}
.lines tr.tot td{border-top:1.5px solid var(--ink);font-weight:700}
.lines tr.tot td:last-child{font-size:22px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
@media(max-width:720px){.pick{grid-template-columns:1fr}.pick .ph{min-height:0}.pick .ph img{max-height:220px}}

.anchor{background:var(--card);border:1.5px solid var(--ink);padding:18px;margin:14px 0}
.anchor p{margin:4px 0 16px;max-width:820px}
.dots{display:grid;gap:7px;position:relative}
.drow{display:grid;grid-template-columns:200px 1fr 62px;gap:10px;align-items:center;font-size:14px}
.drow .lab{font-weight:600;min-width:0}
.drow .lab small{font-weight:400;color:var(--muted)}
.drow .val{font:500 13px "IBM Plex Mono",monospace;text-align:right}
.dtrack{height:18px;position:relative;background:linear-gradient(var(--track),var(--track)) center/100% 2px no-repeat}
.ref{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--muted);opacity:.55}
.ref.r33{border-color:var(--no-ink)}.ref.r38{border-color:var(--accent);opacity:.9}
.dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);background:var(--ok);border:2px solid var(--card)}
.dot.thin{background:var(--no-ink)}.dot.own{background:var(--card);border:2.5px solid var(--ink)}
.drow.head .dtrack{background:none;height:34px}
.drow.head .rl{position:absolute;bottom:0;transform:translateX(-50%);font:500 11px/1.15 "IBM Plex Mono",monospace;color:var(--muted);text-align:center;white-space:nowrap}
.drow.own .lab{font-weight:500;font-style:italic}
.dsep{border-top:1px solid var(--hair);margin:3px 0}
@media(max-width:640px){.drow{grid-template-columns:1fr 52px;gap:2px 8px}.drow .lab{grid-column:1/-1;grid-row:1}.drow .dtrack{grid-column:1;grid-row:2}.drow .val{grid-column:2;grid-row:2}.drow.head .lab{display:none}.drow.head .rl{font-size:10px}}

.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:14px 0}
.box{background:var(--card);border:1px solid var(--hair);padding:16px 18px}
.box h3{margin:0 0 6px;font:800 20px/1.2 Fraunces,Georgia,serif}
.box p{margin:0}
.legend{font-size:14px;color:var(--muted);max-width:820px;margin:16px 0 0}

section{padding:34px 0 6px}
section>h2{font:800 clamp(26px,3.6vw,38px)/1.1 Fraunces,Georgia,serif;margin:0 0 6px}
.intro{max-width:760px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--hair);display:flex;flex-direction:column;position:relative;min-width:0}
.card.top{border:1.5px solid var(--ink)}
.ribbon{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.05em;padding:3px 8px;z-index:1}
.main{background:#fff;aspect-ratio:4/3;width:100%;object-fit:contain;cursor:zoom-in;padding:8px}
.thumbs{display:flex;gap:6px;padding:6px 12px 0}
.thumbs img{width:48px;height:48px;object-fit:contain;background:#fff;border:1px solid var(--hair);cursor:pointer;padding:0}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.cb h3{margin:0;font-size:18px;line-height:1.25}
.cb .brand{color:var(--muted);font-size:13px}
.jobs{width:100%;border-collapse:collapse;font-size:14px}
.jobs th{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 6px 3px 0}
.jobs td{padding:6px 6px 6px 0;border-top:1px solid var(--hair);vertical-align:top}
.jobs td.w{font-weight:700;white-space:nowrap}
.jobs td.p{font:600 14px "IBM Plex Mono",monospace;white-space:nowrap}
.jobs td.h{font:500 14px "IBM Plex Mono",monospace;white-space:nowrap}
.chip{display:inline-block;font-size:12px;line-height:1.3;padding:2px 7px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.chip.thin{background:#f6dcd6;color:var(--no-ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:baseline;border:1px solid rgba(0,0,0,.25)}
.three{font:600 15px "IBM Plex Mono",monospace}
.three small{font:400 12.5px Inter,sans-serif;color:var(--muted);display:block}
dl{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;margin:0;font-size:13.5px}
dt{color:var(--muted)}dd{margin:0}
.note{margin:0;font-size:15px}
.flags{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.flags li{background:var(--warn-bg);color:var(--warn-ink);font-size:13px;line-height:1.35;padding:4px 8px}
.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:10px 14px;text-align:center}
.btn:hover{background:var(--accent)}
.btn.alt{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.btn.alt:hover{background:var(--ink);color:#fff}
.cb .btn{margin-top:auto}
.also{font-size:13px;color:var(--muted);text-align:center}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.rows li{padding:10px 0;border-bottom:1px solid var(--hair);display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:4px 18px;font-size:15px}
.rows a{font-weight:600}
.rows .meta{display:block;font:500 12.5px "IBM Plex Mono",monospace;color:var(--muted);margin-top:2px}
h3.subh{font:800 20px/1.2 Fraunces,Georgia,serif;margin:22px 0 8px}
@media(max-width:640px){.rows li{grid-template-columns:1fr}}
footer{padding:30px 0 40px;color:var(--muted);font-size:14px}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:50;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;background:#fff}
</style>
</head>
<body>
<div class="wrap">
<header class="masthead">
  <div class="kicker"><a href="https://github.com/DrewHoo/shopping-lookbook" target="_blank" rel="noopener">A shopping lookbook</a> · <span id="kt"></span></div>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
</header>
<div id="pick"></div>
<div class="anchor"><div class="mono">Handle diameter at 16kg, in millimeters</div><p id="chartBox"></p><div class="dots" id="dots"></div></div>
<div class="boxes" id="boxes"></div>
<p class="legend" id="legend"></p>
<section id="hard"><h2></h2><p class="intro"></p><div class="grid"></div></section>
<section id="comp"><h2></h2><p class="intro"></p><div class="grid"></div></section>
<section id="used"><h2></h2><p class="intro"></p><ul class="rows" id="usedrows"></ul><h3 class="subh">Searches to rerun</h3><ul class="rows" id="watchrows"></ul></section>
<section id="passed"><h2></h2><p class="intro"></p><ul class="rows"></ul></section>
<footer id="foot"></footer>
<div id="comments"></div>
</div>
<div class="lb" id="lb"><img id="lbimg" alt=""></div>
<script>
/*DATA*/
const COPY = /*COPY*/;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$' + (Number.isInteger(n) ? n : n.toFixed(2));
const mm = n => (Number.isInteger(n) ? n : n.toFixed(1)) + 'mm';
const three = i => (i.pair16 || 2 * i.p16) + i.p20;
const SWATCH = {yellow:'#e8b321', purple:'#6b3fa0', gray:'#9a9a96', pink:'#e24b8f'};
const sw = t => { const k = Object.keys(SWATCH).find(c => t.toLowerCase().includes(c)); return k ? `<span class="sw" style="background:${SWATCH[k]}"></span>` : ''; };

$('#kt').textContent = COPY.kicker_tail;
$('#h1').textContent = COPY.h1;
$('#sub').textContent = COPY.sub;
$('#chartBox').textContent = COPY.chartBox;
$('#legend').textContent = COPY.legend;
$('#foot').textContent = COPY.footer;
$('#boxes').innerHTML = [['box1h','box1'],['box2h','box2'],['box3h','box3']].map(([h,b]) => `<div class="box"><h3>${esc(COPY[h])}</h3><p>${esc(COPY[b])}</p></div>`).join('');

const hard = ITEMS.filter(i => i.sec === 'hard').sort((a,b) => a.rank - b.rank);
const comp = ITEMS.filter(i => i.sec === 'comp').sort((a,b) => a.rank - b.rank);
const pick = hard[0];
$('#pick').innerHTML = `<div class="pick"><div class="ph"><img src="${pick.imgs[0]}" alt="${esc(pick.brand+' '+pick.name)}"></div><div class="pb">
  <div class="mono">${esc(COPY.plan_h)}</div><h2>${esc(pick.brand)} ${esc(pick.name.replace(' Kettlebells',''))}, three bells</h2>
  <table class="lines">
   <tr><td>16kg pair<small>${mm(pick.h16)} handles · ${esc(pick.band16.toLowerCase())}</small></td><td>${money(pick.pair16)}</td></tr>
   <tr><td>20kg, to pair with the KBK<small>${mm(pick.h20)} handle against the KBK’s ${mm(OWNED[0].mm)} · ${esc(pick.band20.toLowerCase())}</small></td><td>${money(pick.p20)}</td></tr>
   <tr class="tot"><td>Three bells<small>${esc(pick.ship)}</small></td><td>${money(three(pick))}</td></tr>
  </table>
  <p>${esc(COPY.plan_why)}</p>
  <div class="btns"><a class="btn" href="${pick.pairUrl}" target="_blank" rel="noopener">16kg pair at ${esc(pick.via)}</a><a class="btn alt" href="${pick.url}" target="_blank" rel="noopener">Single 20kg</a></div></div></div>`;

// dot plot: 16kg handle diameter, 30–40mm
const LO = 30, HI = 40, x = v => (v - LO) / (HI - LO) * 100;
const refs = `<div class="ref r33" style="left:${x(33)}%"></div><div class="ref" style="left:${x(35)}%"></div><div class="ref r38" style="left:${x(38)}%"></div>`;
const drow = (lab, small, v, cls) => `<div class="drow ${cls==='own'?'own':''}"><span class="lab">${esc(lab)}${small?` <small>${esc(small)}</small>`:''}</span><div class="dtrack">${refs}<div class="dot ${cls}" style="left:${x(v)}%"></div></div><span class="val">${mm(v)}</span></div>`;
$('#dots').innerHTML = `<div class="drow head"><span class="lab"></span><div class="dtrack"><span class="rl" style="left:${x(33)}%">33<br>REP 16</span><span class="rl" style="left:${x(35)}%">35<br>Titan</span><span class="rl" style="left:${x(38)}%">38<br>KBK 20</span></div><span class="val"></span></div>`
 + OWNED.map(o => drow(o.label, 'yours · ' + o.verdict, o.mm, 'own')).join('') + '<div class="dsep"></div>'
 + [...hard, ...comp].sort((a,b) => b.h16 - a.h16 || a.rank - b.rank).map(i => drow(i.short, i.sec==='comp' ? 'competition' : '', i.h16, i.h16 < TARGET.min ? 'thin' : '')).join('');

const job16 = i => i.job16 === 'yes' ? `<span class="chip">Thick enough</span>` : `<span class="chip thin">Thin, like the REP</span>`;
const job20 = i => `<span class="chip">Close to the KBK</span>`;
function card(i, first){
  const isComp = i.sec === 'comp';
  const jobs = isComp
   ? `<table class="jobs"><tr><th></th><th>Handle</th><th>Each</th><th>Pair</th></tr>
      <tr><td class="w">16kg</td><td class="h">${mm(i.h16)}</td><td class="p">${money(i.p16)}</td><td class="p">${money(2*i.p16)}</td></tr></table>`
   : `<table class="jobs"><tr><th></th><th>Handle</th><th>Price</th><th>For Drew</th></tr>
      <tr><td class="w">16kg</td><td class="h">${mm(i.h16)}</td><td class="p">${money(i.p16)}</td><td>${job16(i)}<br>${sw(i.band16)}${esc(i.band16)}</td></tr>
      <tr><td class="w">20kg</td><td class="h">${mm(i.h20)}</td><td class="p">${money(i.p20)}</td><td>${job20(i)}<br>${sw(i.band20)}${esc(i.band20)}</td></tr></table>
      <div class="three">${money(three(i))} for two 16s and a 20<small>${i.pair16 ? 'Using the pair price for the 16s. ' : ''}Shipping: ${esc(i.ship.toLowerCase())}</small></div>`;
  const dl = isComp
   ? `<dl><dt>Handle</dt><dd>${esc(i.handle)}, ${mm(i.h16)}</dd><dt>Body</dt><dd>${esc(i.coat)}</dd><dt>Color</dt><dd>${sw(i.band16)}${esc(i.band16)}</dd><dt>Build</dt><dd>${esc(i.cast)}</dd></dl>`
   : `<dl><dt>Coat</dt><dd>${esc(i.coat)}</dd><dt>Build</dt><dd>${esc(i.cast)}</dd><dt>Handle from</dt><dd>${esc(i.hsrc)}</dd><dt>Rating</dt><dd>${esc(i.rating)}</dd></dl>`;
  return `<article class="card ${first?'top':''}" id="c-${i.id}">
   ${first ? '<div class="ribbon">THE PICK</div>' : ''}
   <img class="main" src="${i.imgs[0]}" alt="${esc(i.brand+' '+i.name)}" loading="lazy">
   ${i.imgs.length>1 ? `<div class="thumbs">${i.imgs.map(u=>`<img src="${u}" alt="" loading="lazy">`).join('')}</div>` : ''}
   <div class="cb"><div><div class="brand">${esc(i.brand)}</div><h3>${esc(i.name)}</h3></div>
   ${jobs}${dl}
   <p class="note">${esc(COPY.notes[i.id])}</p>
   ${i.flags.length?`<ul class="flags">${i.flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
   <a class="btn" href="${i.url}" target="_blank" rel="noopener">View at ${esc(i.via)}</a>
   ${i.pairUrl?`<a class="also" href="${i.pairUrl}" target="_blank" rel="noopener">Pairs: 16kg ${money(i.pair16)}, 20kg ${money(i.pair20)}</a>`:''}
   </div></article>`;
}
for (const [id, list] of [['hard', hard], ['comp', comp]]) {
  const s = document.getElementById(id);
  s.querySelector('h2').textContent = COPY.sections[id].title;
  s.querySelector('.intro').textContent = COPY.sections[id].intro;
  s.querySelector('.grid').innerHTML = list.map((i,n) => card(i, id==='hard' && n===0)).join('');
}
const us = $('#used');
us.querySelector('h2').textContent = COPY.sections.used.title;
us.querySelector('.intro').textContent = COPY.sections.used.intro;
$('#usedrows').innerHTML = USED.map(u => `<li><span><a href="${u.url}" target="_blank" rel="noopener">${esc(u.what)}</a><span class="meta">${money(u.price)} · ${esc(u.where)} · ${esc(u.src)}</span></span><span>${esc(u.note)}</span></li>`).join('');
$('#watchrows').innerHTML = WATCH.map(([n,u,w]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(n)}</a><span>${esc(w)}</span></li>`).join('');
const ps = $('#passed');
ps.querySelector('h2').textContent = COPY.sections.passed.title;
ps.querySelector('.intro').textContent = COPY.sections.passed.intro;
ps.querySelector('ul').innerHTML = PASSED.map(([n,w,u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(n)}</a><span>${esc(w)}</span></li>`).join('');

document.addEventListener('click', e => {
  const t = e.target;
  if (t.matches('.thumbs img')) t.closest('.card').querySelector('.main').src = t.src;
  else if (t.matches('.main')) { $('#lbimg').src = t.src; $('#lb').classList.add('on'); }
  else if (t.closest('#lb')) $('#lb').classList.remove('on');
});
</script>
</body>
</html>
