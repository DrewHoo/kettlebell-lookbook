 ['Onnit','Stopped selling fitness equipment in 2025, per its own support page.','https://support.onnit.com/hc/en-us/articles/31776847122711-Fitness-Product-Changes-at-Onnit'],
 ['Great Lakes Girya R-SPEC and P-SPEC','E-coated hardstyle bells at $120 to $199. The 16kg and 20kg were both sold out.','https://greatlakesgirya.com/products/r-spec-e-coated-hardstyle-kettlebells'],
 ['Kettlebells USA Metrixx Elite','E-coat, in stock at $139.99 for 16kg and $179.99 for 20kg. A pair of 16s is $280, the 20 is over the $150 ceiling, and the page doesn’t give a handle size.','https://www.kettlebellsusa.com/products/metrixx-elite-precision-ecoat-cast-iron-kettlebell'],
 ['Bells of Steel Powder Coated','$84.99 and $99.99 with yellow and purple bands, but no handle size per weight on the page.','https://www.bellsofsteel.us/products/powder-coated-kettlebells'],
 ['Again Faster PRx Powder Coated','$79.99 and $89.99. Handle sizes reported as 33mm and 38mm, the same as REP, so the 16 gains nothing.','https://www.againfaster.com/products/prx-powder-coated-cast-iron-kettlebells'],
 ['Titan Cast Iron','$75.97 and $104.99. Reported at 33mm for the 16kg.','https://www.titan.fitness/products/16-kg-cast-iron-kettlebell'],
 ['Rogue Competition','$128 and $143 with a 33mm handle, thinner than the 35mm competition handle Drew already likes.','https://www.roguefitness.com/rogue-competition-kettlebells'],
 ['American Barbell Competition','$210 for the 16kg, and sold out.','https://americanbarbell.com/products/competition-kettlebells'],
];

const COPY = {"title_options": ["Kettlebell Kings Alternative With a Thick 16kg Handle", "Thick-Handle 16kg Kettlebells Under $150 a Bell", "Fringe Prime vs Rogue: Thick 16kg Kettlebell Handles"], "title": "Kettlebell Kings Alternative With a Thick 16kg Handle", "h1_options": ["Buy three Fringe Primes for $210", "The Kettlebell Kings 16 was thin too", "Two pairs of doubles, one of them a KBK"], "h1": "Buy three Fringe Primes for $210", "kicker_tail": "doubles at 16 and 20kg for $210", "sub": "Drew owns one Kettlebell Kings 20kg and calls its handle the standard. He wants doubles at 16kg and 20kg, which means a mate for the KBK and two new 16s, at no more than about $150 a bell. Buy three Fringe Sport Primes: a 16kg pair for $130 and a 20kg for $80, shipped free. Their handles measure 37.8mm and 38.9mm against the KBK's 38.", "meta_description": "Fringe Sport Prime for all three: a 16kg pair and a 20kg for $210 shipped, with handles that match a Kettlebell Kings 20kg's 38mm.", "plan_h": "Three Fringe Primes, $210", "plan_why": "Fringe Prime is one of two hardstyle lines where the maker confirms a thick handle at 16kg, and it is the cheaper of the two. Three bells cost $210 with free shipping, where Rogue's three are $255 before a shipping charge we never got quoted. The bands are yellow at 16 and purple at 20; Rogue's 20kg stripe is gray. The open risk is the finish. One buyer on Fringe's page says \"they're not really slick but they're not like cheese grater either,\" and no owner of both a Fringe and a KBK has compared them.", "chartBox": "Each dot is a 16kg handle in millimeters, as its maker or a reviewer published it. The three lines are Drew's own bells: 33mm is his REP 16, which he finds a little thin, 35mm is his Titan competition 12, which he likes, and 38mm is his KBK 20, the standard. A dot under 35 repeats the REP problem.", "box1h": "The Kettlebell Kings 16 was thin too", "box1": "KBK's size guide, which we read through a search excerpt because the store is offline, put its powder coat 16kg at 33mm and its 20kg at 38mm. REP publishes the same two numbers, and Giant and Again Faster report them too. A KBK 16 would have felt like Drew's REP 16. In that family, the handle he likes starts at 20kg.", "box2h": "Finish doesn't show up on a product page", "box2": "Drew's complaint about the REPs is the surface, and no photo or spec sheet settles that. For Fringe there is one buyer review on Fringe's own page and no comparison to a KBK. For Rogue, one r/kettlebell owner of both says Rogue and KBK powder coat \"feel and look exactly the same,\" while other owners around the same time call Rogue's coat gritty and say they sanded it. So the pick rests on handle size, price, shipping and color, and the finish is a bet.", "box3h": "Sandpaper for the REPs he keeps", "box3": "The StrongFirst forum's advice for a rough handle is P120 sandpaper run lengthwise along it, then chalk. One poster found 120 grit left the handle too smooth and went back over it with 40. There is no agreed recipe. It could fix the REP 24kg for a few dollars, but no amount of sanding makes the REP 16 any thicker.", "legend": "The first group is hardstyle lines sold in both 16kg and 20kg whose listings we opened, and the second is competition 16s with 35mm steel handles, the size of Drew's Titan. Everything comes in under about $150 a bell. Handle figures are diameters in millimeters, from the maker unless the card names a reviewer or a reseller. Amazon was not checked, because its page says AI agents aren't allowed. Prices as of November 23, 2026; listings change.", "sections": {"hard": {"title": "Hardstyle, sold in both weights", "intro": "This list is in order. The first four have a thick handle at 16kg by the maker's own measure, and Fringe is the only one of them with free shipping. The last three would make a fine mate for the KBK 20 and a thin 16."}, "comp": {"title": "If the 16s go competition", "intro": "This was the fallback in case no hardstyle 16 had a thick enough handle, and Fringe and Rogue made it unnecessary. All three have the 35mm steel handle Drew likes on his Titan 12. Competition bells are the same size at every weight, and one forum owner reports no clearance trouble using them for doubles; we found nothing recent on double swings."}, "used": {"title": "Used, within an hour's drive", "intro": "On November 23 we ran five Facebook Marketplace searches within 60 miles and got 127 listings, 43 of them kettlebells. None was a KBK, a Rogue or any other premium bell in 16kg or 20kg. Craigslist across Connecticut's regions was mostly one out-of-state warehouse's $1 ads. The nearest real candidates, below, are in Queens and the Hudson Valley, past the hour. The StrongFirst forum's rule of thumb is about $1 a pound for generic cast iron and $2 for premium, which puts a used premium 20kg at $60 to $85."}, "passed": {"title": "Checked and passed on", "intro": "Kettlebell Kings, Dragon Door and Onnit no longer sell bells. The rest were sold out, over the ceiling, thin at 16kg, or silent about handle size, and each has its reason next to its name."}}, "notes": {"fringe": "All three bells: the pair of 16s and the 20 that goes with the KBK. Its handles land within a millimeter of the KBK 20's on paper. How they feel next to it is the part nobody has reported.", "rogue": "The backup for all three, with a 38mm handle at both weights and the one owner who says its coat matches KBK's. It costs $45 more before shipping, and other owners have sanded theirs.", "rogue-ecoat": "The smooth option, if grit is the worry. It matches the handles and gives up color coding entirely.", "rogue-pc": "In Drew's plan it does what the E-Coat does, with a textured coat in place of the smooth one. The 16s and the 20 would be told apart by the stamp.", "ab": "A 20kg mate for the KBK: 38mm, purple band, $128. One owner says its coating looks closer to the KBK's than Bells of Steel's does, but its 16 is only 34mm.", "giant": "A 20kg mate at $86.38, with a 38mm handle and a purple band. Its 16 measures the same as the REP that's becoming a spare.", "rep": "The REP 20kg is the KBK 20's twin on paper, 38mm at $94.99. It brings a gray band and the finish Drew already finds rough, though some owners call REP's coat too slick, which suggests batches vary.", "pb": "The first choice if the 16s go competition, at $89.95 with an unpainted steel handle. StrongFirst forum users in January called Perform Better's bells \"perfect bells.\"", "titan": "The same model as Drew's 12kg, so the handle is a known quantity. It costs $14 more than Perform Better, and the 16 is pink.", "bos": "Yellow at 16kg, the usual competition color, for $109.99. It is the most expensive of the three, and we found nothing it has that the other two lack."}, "footer": "Nobody here handled a bell, and every word about finish comes from an owner's review or forum post."};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$' + (Number.isInteger(n) ? n : n.toFixed(2));
const mm = n => (Number.isInteger(n) ? n : n.toFixed(1)) + 'mm';
const three = i => (i.pair16 || 2 * i.p16) + i.p20;
const SWATCH = {yellow:'#e8b321', purple:'#6b3fa0', gray:'#9a9a96', pink:'#e24b8f'};
const sw = t => { const k = Object.keys(SWATCH).find(c => t.toLowerCase().includes(c)); return k ? `<span class="sw" style="background:${SWATCH[k]}"></span>` : ''; };

$('#kt').textContent = COPY.kicker_tail;
$('#h1').textContent = COPY.h1;
$('#sub').textContent = COPY.sub;
$('#chartBox').textContent = COPY.chartBox;
$('#legend').textContent = COPY.legend;
$('#foot').textContent = COPY.footer;
$('#boxes').innerHTML = [['box1h','box1'],['box2h','box2'],['box3h','box3']].map(([h,b]) => `<div class="box"><h3>${esc(COPY[h])}</h3><p>${esc(COPY[b])}</p></div>`).join('');

const hard = ITEMS.filter(i => i.sec === 'hard').sort((a,b) => a.rank - b.rank);
const comp = ITEMS.filter(i => i.sec === 'comp').sort((a,b) => a.rank - b.rank);
const pick = hard[0];
$('#pick').innerHTML = `<div class="pick"><div class="ph"><img src="${pick.imgs[0]}" alt="${esc(pick.brand+' '+pick.name)}"></div><div class="pb">
  <div class="mono">${esc(COPY.plan_h)}</div><h2>${esc(pick.brand)} ${esc(pick.name.replace(' Kettlebells',''))}, three bells</h2>
  <table class="lines">
   <tr><td>16kg pair<small>${mm(pick.h16)} handles · ${esc(pick.band16.toLowerCase())}</small></td><td>${money(pick.pair16)}</td></tr>
   <tr><td>20kg, to pair with the KBK<small>${mm(pick.h20)} handle against the KBK’s ${mm(OWNED[0].mm)} · ${esc(pick.band20.toLowerCase())}</small></td><td>${money(pick.p20)}</td></tr>
   <tr class="tot"><td>Three bells<small>${esc(pick.ship)}</small></td><td>${money(three(pick))}</td></tr>
  </table>
  <p>${esc(COPY.plan_why)}</p>
  <div class="btns"><a class="btn" href="${pick.pairUrl}" target="_blank" rel="noopener">16kg pair at ${esc(pick.via)}</a><a class="btn alt" href="${pick.url}" target="_blank" rel="noopener">Single 20kg</a></div></div></div>`;

// dot plot: 16kg handle diameter, 30–40mm
const LO = 30, HI = 40, x = v => (v - LO) / (HI - LO) * 100;
const refs = `<div class="ref r33" style="left:${x(33)}%"></div><div class="ref" style="left:${x(35)}%"></div><div class="ref r38" style="left:${x(38)}%"></div>`;
const drow = (lab, small, v, cls) => `<div class="drow ${cls==='own'?'own':''}"><span class="lab">${esc(lab)}${small?` <small>${esc(small)}</small>`:''}</span><div class="dtrack">${refs}<div class="dot ${cls}" style="left:${x(v)}%"></div></div><span class="val">${mm(v)}</span></div>`;
$('#dots').innerHTML = `<div class="drow head"><span class="lab"></span><div class="dtrack"><span class="rl" style="left:${x(33)}%">33<br>REP 16</span><span class="rl" style="left:${x(35)}%">35<br>Titan</span><span class="rl" style="left:${x(38)}%">38<br>KBK 20</span></div><span class="val"></span></div>`
 + OWNED.map(o => drow(o.label, 'yours · ' + o.verdict, o.mm, 'own')).join('') + '<div class="dsep"></div>'
 + [...hard, ...comp].sort((a,b) => b.h16 - a.h16 || a.rank - b.rank).map(i => drow(i.short, i.sec==='comp' ? 'competition' : '', i.h16, i.h16 < TARGET.min ? 'thin' : '')).join('');

const job16 = i => i.job16 === 'yes' ? `<span class="chip">Thick enough</span>` : `<span class="chip thin">Thin, like the REP</span>`;
const job20 = i => `<span class="chip">Close to the KBK</span>`;
function card(i, first){
  const isComp = i.sec === 'comp';
  const jobs = isComp
   ? `<table class="jobs"><tr><th></th><th>Handle</th><th>Each</th><th>Pair</th></tr>
      <tr><td class="w">16kg</td><td class="h">${mm(i.h16)}</td><td class="p">${money(i.p16)}</td><td class="p">${money(2*i.p16)}</td></tr></table>`
   : `<table class="jobs"><tr><th></th><th>Handle</th><th>Price</th><th>For Drew</th></tr>
      <tr><td class="w">16kg</td><td class="h">${mm(i.h16)}</td><td class="p">${money(i.p16)}</td><td>${job16(i)}<br>${sw(i.band16)}${esc(i.band16)}</td></tr>
      <tr><td class="w">20kg</td><td class="h">${mm(i.h20)}</td><td class="p">${money(i.p20)}</td><td>${job20(i)}<br>${sw(i.band20)}${esc(i.band20)}</td></tr></table>
      <div class="three">${money(three(i))} for two 16s and a 20<small>${i.pair16 ? 'Using the pair price for the 16s. ' : ''}Shipping: ${esc(i.ship.toLowerCase())}</small></div>`;
  const dl = isComp
   ? `<dl><dt>Handle</dt><dd>${esc(i.handle)}, ${mm(i.h16)}</dd><dt>Body</dt><dd>${esc(i.coat)}</dd><dt>Color</dt><dd>${sw(i.band16)}${esc(i.band16)}</dd><dt>Build</dt><dd>${esc(i.cast)}</dd></dl>`
   : `<dl><dt>Coat</dt><dd>${esc(i.coat)}</dd><dt>Build</dt><dd>${esc(i.cast)}</dd><dt>Handle from</dt><dd>${esc(i.hsrc)}</dd><dt>Rating</dt><dd>${esc(i.rating)}</dd></dl>`;
  return `<article class="card ${first?'top':''}" id="c-${i.id}">
   ${first ? '<div class="ribbon">THE PICK</div>' : ''}
   <img class="main" src="${i.imgs[0]}" alt="${esc(i.brand+' '+i.name)}" loading="lazy">
   ${i.imgs.length>1 ? `<div class="thumbs">${i.imgs.map(u=>`<img src="${u}" alt="" loading="lazy">`).join('')}</div>` : ''}
   <div class="cb"><div><div class="brand">${esc(i.brand)}</div><h3>${esc(i.name)}</h3></div>
   ${jobs}${dl}
   <p class="note">${esc(COPY.notes[i.id])}</p>
   ${i.flags.length?`<ul class="flags">${i.flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
   <a class="btn" href="${i.url}" target="_blank" rel="noopener">View at ${esc(i.via)}</a>
   ${i.pairUrl?`<a class="also" href="${i.pairUrl}" target="_blank" rel="noopener">Pairs: 16kg ${money(i.pair16)}, 20kg ${money(i.pair20)}</a>`:''}
   </div></article>`;
}
for (const [id, list] of [['hard', hard], ['comp', comp]]) {
  const s = document.getElementById(id);
  s.querySelector('h2').textContent = COPY.sections[id].title;
  s.querySelector('.intro').textContent = COPY.sections[id].intro;
  s.querySelector('.grid').innerHTML = list.map((i,n) => card(i, id==='hard' && n===0)).join('');
}
const us = $('#used');
us.querySelector('h2').textContent = COPY.sections.used.title;
us.querySelector('.intro').textContent = COPY.sections.used.intro;
$('#usedrows').innerHTML = USED.map(u => `<li><span><a href="${u.url}" target="_blank" rel="noopener">${esc(u.what)}</a><span class="meta">${money(u.price)} · ${esc(u.where)} · ${esc(u.src)}</span></span><span>${esc(u.note)}</span></li>`).join('');
$('#watchrows').innerHTML = WATCH.map(([n,u,w]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(n)}</a><span>${esc(w)}</span></li>`).join('');
const ps = $('#passed');
ps.querySelector('h2').textContent = COPY.sections.passed.title;
ps.querySelector('.intro').textContent = COPY.sections.passed.intro;
ps.querySelector('ul').innerHTML = PASSED.map(([n,w,u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(n)}</a><span>${esc(w)}</span></li>`).join('');

document.addEventListener('click', e => {
  const t = e.target;
  if (t.matches('.thumbs img')) t.closest('.card').querySelector('.main').src = t.src;
  else if (t.matches('.main')) { $('#lbimg').src = t.src; $('#lb').classList.add('on'); }
  else if (t.closest('#lb')) $('#lb').classList.remove('on');
});
</script>
</body>
</html>
